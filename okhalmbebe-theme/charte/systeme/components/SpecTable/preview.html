<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SpecTable</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6}
  .wrap{padding:20px}
  p{margin:0}
  h2,h3{margin:0;font-family:var(--font-sans);color:var(--ink);font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  .badge{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--radius-pill);background:var(--lavender);color:var(--plum)}
  .badge.sm{width:34px;height:34px}.badge.sm .ico{width:18px;height:18px}
  .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--gold)}
.panel{background:var(--sand);border-radius:var(--radius-lg);padding:24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .g{background:var(--white);border-radius:var(--radius-md);padding:16px 18px 6px}
  .g h3{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--plum);margin-bottom:4px}
  dl{margin:0}.r{display:grid;grid-template-columns:.9fr 1.1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.r:last-child{border-bottom:0}
  dt{font-size:13.5px;color:var(--muted)}dd{margin:0;font-size:13.5px;font-weight:700}
  .foot{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}</style>
</head>
<body>
<div class="wrap">
<div class="panel"><div class="grid">
<div class="g"><h3><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v17"/><path d="M8.8 6.7 12 3.5l3.2 3.2"/><path d="M8.8 17.3 12 20.5l3.2-3.2"/><path d="M4 8.5h2.6"/><path d="M4 12h2.6"/><path d="M4 15.5h2.6"/><path d="M17.4 8.5H20"/><path d="M17.4 12H20"/><path d="M17.4 15.5H20"/></svg>Dimensions &amp; utilisation</h3><dl><div class="r"><dt>Dimensions indiquées</dt><dd>94 × 52 cm</dd></div><div class="r"><dt>Âge indiqué par le fabricant</dt><dd>0–24 mois</dd></div><div class="r"><dt>Hauteur</dt><dd>réglable sur 3 niveaux</dd></div></dl></div>
<div class="g"><h3><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.2 3.6 19.3h16.8Z"/><path d="M12 4.2v15.1"/><path d="M7.8 11.8h8.4"/><path d="M13.2 4.2a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0Z"/><path d="M4.8 19.3a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0Z"/><path d="M21.6 19.3a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0Z"/></svg>Structure &amp; mobilité</h3><dl><div class="r"><dt>Structure</dt><dd>acier carbone</dd></div><div class="r"><dt>Roulettes</dt><dd>pivotantes à 360°</dd></div><div class="r"><dt>Freins</dt><dd>oui</dd></div></dl></div>
</div><p class="foot">Informations indiquées par le fabricant.</p></div>
</div>
</body>
</html>
