<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RatingHeader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6}
  .wrap{padding:20px}
  p{margin:0}
  h2,h3{margin:0;font-family:var(--font-sans);color:var(--ink);font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  .badge{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--radius-pill);background:var(--lavender);color:var(--plum)}
  .badge.sm{width:34px;height:34px}.badge.sm .ico{width:18px;height:18px}
  .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--gold)}
.t{text-align:center;font-size:32px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 12px}
  .score{display:flex;justify-content:center;align-items:center;gap:8px;font-size:16px}
  .stars{display:inline-flex;gap:2px}.stars svg{fill:var(--gold)}.n{color:var(--muted)}</style>
</head>
<body>
<div class="wrap">
<div class="eyebrow" style="text-align:center">Avis vérifiés</div>
<h2 class="t">Ce qu’en disent les parents</h2>
<p class="score"><span class="stars"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8Z"/></svg><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8Z"/></svg><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8Z"/></svg><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8Z"/></svg><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8Z"/></svg></span><strong>4,8/5</strong><span class="n">— 51 avis</span></p>
</div>
</body>
</html>
