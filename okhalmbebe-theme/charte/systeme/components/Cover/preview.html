<!-- @dsCard height=300 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>O Khalm Bébé</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--white); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .plum { fill:var(--plum); }
  .deep { fill:var(--plum-deep); }
  .lav { fill:var(--lavender); }
  .sand { fill:var(--sand); }
  .gold { fill:var(--gold); }
  .lg { rx:var(--radius-lg); }
  .md { rx:var(--radius-md); }
  .words { position:absolute; left:40px; bottom:36px; max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; white-space:nowrap; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:12px 0 0 4px; font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      plum 248×256 bled off the top (identity, largest) · plum-deep 148×264 bled off the right and bottom · lavender 248×72 bled off the bottom · sand 148×40 · gold pill 64×22 once (it marks prices and stars) ≈ 40% of 960×300
  arrangement one tall plum slab with a deep satellite column, a lavender band under it, a sand cap over the column; gutters 16px (space-4)
  pattern     crescent moons, from "Une seule spécialité : les nuits des tout-petits" and the brand's lune pictogram: three gold discs cut by plum discs of the same radius on the slab, five small lavender discs as stars on plum-deep
  scales      gutters space-4 (16px); block corners radius-lg (14px), sand cap radius-md (10px); pill rx half its height (11px); moon radius 22px, star radius 4px
-->
<rect class="plum lg" x="24" y="-20" width="248" height="256" rx="14"/>
<rect class="lav lg" x="24" y="252" width="248" height="72" rx="14"/>
<rect class="sand md" x="288" y="-16" width="148" height="56" rx="10"/>
<rect class="deep lg" x="288" y="56" width="212" height="264" rx="14"/>
<rect class="gold" x="192" y="266" width="64" height="22" rx="11"/>
<circle class="gold" cx="84" cy="70" r="22"/><circle class="plum" cx="95" cy="62" r="22"/>
<circle class="gold" cx="178" cy="132" r="22"/><circle class="plum" cx="189" cy="124" r="22"/>
<circle class="gold" cx="96" cy="190" r="22"/><circle class="plum" cx="107" cy="182" r="22"/>
<circle class="lav" cx="330" cy="100" r="4"/><circle class="lav" cx="392" cy="136" r="4"/>
<circle class="lav" cx="350" cy="184" r="4"/><circle class="lav" cx="418" cy="218" r="4"/>
<circle class="lav" cx="324" cy="258" r="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">O Khalm<br>Bébé</h1>
<p class="tag">Une seule spécialité : les nuits des tout-petits.</p>
</div>
</div>
</body>
</html>
