<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BenefitList</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6}
  .wrap{padding:20px}
  p{margin:0}
  h2,h3{margin:0;font-family:var(--font-sans);color:var(--ink);font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  .badge{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--radius-pill);background:var(--lavender);color:var(--plum)}
  .badge.sm{width:34px;height:34px}.badge.sm .ico{width:18px;height:18px}
  .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--gold)}
.lead{font-size:18px;line-height:1.35;font-weight:700;color:var(--plum);margin-bottom:6px}
  .txt{font-size:14.5px;color:var(--muted);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
  .grid li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--sand);font-size:13.5px;font-weight:700;line-height:1.3}
  .grid .ico{color:var(--plum);flex:none}</style>
</head>
<body>
<div class="wrap">
<p class="lead">Gardez bébé près de vous, de la nuit à la sieste.</p>
<p class="txt">Réglable en hauteur, mobile et pliable, ce berceau accompagne bébé dans son propre espace de repos.</p>
<ul class="grid"><li><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v17"/><path d="M8.8 6.7 12 3.5l3.2 3.2"/><path d="M8.8 17.3 12 20.5l3.2-3.2"/><path d="M4 8.5h2.6"/><path d="M4 12h2.6"/><path d="M4 15.5h2.6"/><path d="M17.4 8.5H20"/><path d="M17.4 12H20"/><path d="M17.4 15.5H20"/></svg><span>3 hauteurs réglables</span></li><li><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 13a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0Z"/><path d="M11.2 13a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0Z"/><path d="M10 7.5v4.3"/><path d="M10 14.2v4.3"/><path d="M4.5 13h4.3"/><path d="M11.2 13h4.3"/><path d="M1.5 13A8.5 8.5 0 0 1 17.7 9.4"/><path d="M17.7 9.4l.4-2.4"/><path d="M17.7 9.4l-2.1-1.2"/><path d="M15.6 16.4h5.6v4.6h-5.6Z"/><path d="M17 16.4V15a1.4 1.4 0 0 1 2.8 0v1.4"/></svg><span>Roulettes 360° avec freins</span></li><li><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7.5h15v3.2a5.3 5.3 0 0 1-5.3 5.3H9.8a5.3 5.3 0 0 1-5.3-5.3Z"/><path d="M8 16l-1.4 3.2"/><path d="M16 16l1.4 3.2"/><path d="M3.5 19.4c5.6 2.1 11.4 2.1 17 0"/><path d="M2 4.8c.9-.9 2.1-1.3 3.3-1.3"/><path d="M22 4.8c-.9-.9-2.1-1.3-3.3-1.3"/></svg><span>Mode fixe ou bercement</span></li><li><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20.5h16"/><path d="M7 20.5 17 8"/><path d="M17 20.5 7 8"/><path d="M4.5 8h5"/><path d="M14.5 8h5"/><path d="M3 4h4.5"/><path d="M5.6 2.2 7.5 4 5.6 5.8"/><path d="M21 4h-4.5"/><path d="M18.4 2.2 16.5 4l1.9 1.8"/></svg><span>Pliable + grand rangement</span></li></ul>
</div>
</body>
</html>
