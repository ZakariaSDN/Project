<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TrustLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6}
  .wrap{padding:20px}
  p{margin:0}
  h2,h3{margin:0;font-family:var(--font-sans);color:var(--ink);font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  .badge{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--radius-pill);background:var(--lavender);color:var(--plum)}
  .badge.sm{width:34px;height:34px}.badge.sm .ico{width:18px;height:18px}
  .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--gold)}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px}
  .trust li{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .trust .ico{color:var(--gold);stroke-width:2.2}
  .trust .ok{color:var(--success);font-weight:700}.trust .ok .ico{color:var(--success)}</style>
</head>
<body>
<div class="wrap">
<ul class="trust"><li class="ok"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span>En stock</span></li><li><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span>Livraison offerte dès 150 €</span></li><li><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span>Paiement sécurisé</span></li><li><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span>Retour sous 14 jours</span></li></ul>
</div>
</body>
</html>
